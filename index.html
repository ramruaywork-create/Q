<style>

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:8px 14px; border-radius:10px; font-weight:600; font-size:14px; transition:all .15s ease; cursor:pointer; border:1px solid transparent; }
  .btn-primary{ background:var(--accent); color:#fff; }

  table.data{ width:100%; border-collapse:collapse; font-size:13.5px; }
  table.data th{ text-align:left; padding:10px 12px; background:#f8fafc; color:#64748b; font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--border); position:sticky; top:0; }

  .toggle.on::after{ transform:translateX(16px); }

  @media(max-width:768px){ .sidebar{ position:fixed; left:-260px; top:0; bottom:0; z-index:50; transition:left .25s; } .sidebar.open{ left:0; } }

</style>

<script>
(function(){
'use strict';
/* ---------- อัปเดตตัวเอง: มีเวอร์ชันใหม่ขึ้นเว็บ → โหลดหน้าใหม่ให้ ไม่ต้องกด Ctrl+F5 ---------- */
const APP_SCRIPT = ((document.currentScript && document.currentScript.textContent) || '').replace(/\r/g, '');
function startVersionWatch(){
  if(!/^https?:$/.test(location.protocol) || !APP_SCRIPT) return;
  const check = async () => {
    if(document.hidden) return;
    try{
      const res = await fetch(location.pathname + '?v=' + Date.now(), {cache:'no-store'});
      if(!res.ok) return;
      const html = (await res.text()).replace(/\r/g, '');
      if(!html.includes('startVersionWatch') || html.includes(APP_SCRIPT)) return; // ยังเป็นเวอร์ชันเดิม
      const sig = html.length + ':' + html.slice(-2000);
      let tried = null; try{ tried = sessionStorage.getItem('sku_reloaded_for'); }catch(e){}
      if(tried === sig) return; // โหลดใหม่ไปแล้วแต่ได้หน้าเดิม (แคช) — ไม่วนโหลดซ้ำ
      if(currentUser && isUserBusy()) return; // กำลังพิมพ์/เปิดหน้าต่างอยู่ — รอรอบถัดไป
      if(apiMode) await flushPush();
      try{ sessionStorage.setItem('sku_reloaded_for', sig); sessionStorage.setItem('sku_return_view', currentView || 'dashboard'); }catch(e){}
      toast('มีเวอร์ชันใหม่ — กำลังโหลดหน้าใหม่...', 'info');
      setTimeout(() => location.reload(), 1500);
    }catch(e){}
  };
  setInterval(check, 60000);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) check(); });
}
/* ============================================================
   SKU WORK TRACKER — client-side SPA (localStorage persistence)
   ============================================================ */
const LS_KEY = 'sku_tracker_db_v2';
const SESS_KEY = 'sku_tracker_session_v1';
/* ข้อมูลกลางของทีมอยู่ที่ Supabase (supabase/functions/sku-api — ทำงานแบบเดียวกับ api.php) */
const API_URL = 'https://ycknodfcpgvmsaegaxcv.supabase.co/functions/v1/sku-api';
const TOKEN_KEY = 'sku_tracker_session_token_v1';
const getToken = () => { try{ return localStorage.getItem(TOKEN_KEY) || ''; }catch(e){ return ''; } };
const setToken = t => { try{ t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); }catch(e){} };
let apiMode = false;
/* ---------- team-mode sync: send only what changed, server merges with other users' changes ---------- */
/* InfinityFree (and similar free hosts) sometimes answer with an "aes.js" browser-check page instead of JSON,
   e.g. when its cookie expires on a page left open for a long time. A page reload passes the check again. */
const PENDING_KEY = 'sku_tracker_pending_ops_v1';
function isBrowserCheckPage(text){ return /aes\.js|slowAES|toNumbers\(|__test=/i.test(text||''); }
async function api(action, body){
  const opts = {cache:'no-store', headers:{}};
  const tok = getToken(); if(tok) opts.headers['X-Session'] = tok;
  if(body !== undefined){ opts.method = 'POST'; opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(API_URL+'?a='+action, opts);
  const text = await r.text();
  let j = null; try{ j = JSON.parse(text); }catch(e){}
  if(!j){ const err = new Error(isBrowserCheckPage(text) ? 'browser_check' : 'not_json'); err.browserCheck = isBrowserCheckPage(text); err.status = r.status; throw err; }
  return {status: r.status, ok: r.ok, j};
}
function pendingKey(){ return PENDING_KEY + ':' + (currentUser ? currentUser.id : '-'); }
function savePendingLocally(ops){ try{ if(ops) localStorage.setItem(pendingKey(), JSON.stringify(ops)); }catch(e){} }
function clearPendingLocally(){ try{ localStorage.removeItem(pendingKey()); }catch(e){} }
function applyStoredPending(){
  let ops = null; try{ ops = JSON.parse(localStorage.getItem(pendingKey()) || 'null'); }catch(e){}
  if(!ops || !DB) return;
  Object.entries(ops).forEach(([c, op]) => {
    if(!Array.isArray(DB[c])) return;
    const del = new Set(op.delete || []);
    DB[c] = DB[c].filter(it => !del.has(it.id));
    (op.upsert || []).forEach(it => { const i = DB[c].findIndex(x => x.id === it.id); if(i >= 0) DB[c][i] = it; else DB[c].push(it); });
  });
  schedulePush(); // server gets the unsent work; the key is cleared after a successful save
}
function recoverFromBrowserCheck(){
  savePendingLocally(mergeOps(pendingOps, (syncSnapshot && DB) ? computeOps() : null));
  const k = 'sku_browser_check_reloads', now = Date.now();
  let log = []; try{ log = JSON.parse(sessionStorage.getItem(k) || '[]').filter(t => now - t < 300000); }catch(e){}
  if(log.length >= 3){ setSync('offline'); toast('เว็บโฮสต์ขอตรวจสอบเบราว์เซอร์ — กรุณากด F5 เพื่อรีเฟรชหน้า (งานที่ทำไว้ไม่หาย)','error'); return; }
  log.push(now); try{ sessionStorage.setItem(k, JSON.stringify(log)); sessionStorage.setItem('sku_return_view', currentView || 'dashboard'); }catch(e){}
  location.reload();
}
const SYNC_COLLS = ['users','shops','products','worklogs','tiktoks','history','tiktok_jobs','sales','import_audits','tasks','campaigns','albums'];
let syncSnapshot = null, pushTimer = null, pushing = null, pendingOps = null, retryTimer = null;
function takeSnapshot(db){
  const snap = {};
  SYNC_COLLS.forEach(c => { const m = new Map(); (db[c]||[]).forEach(it => { if(it && it.id) m.set(it.id, JSON.stringify(it)); }); snap[c] = m; });
  snap.meta = JSON.stringify(db.meta||{});
  return snap;
}
function computeOps(){
  const ops = {}; let any = false;
  SYNC_COLLS.forEach(c => {
    const prev = syncSnapshot[c] || new Map(); const cur = new Set();
    const upsert = [], del = [];
    (DB[c]||[]).forEach(it => { if(!it || !it.id) return; cur.add(it.id); const j = JSON.stringify(it); if(prev.get(it.id) !== j) upsert.push(JSON.parse(j)); });
    prev.forEach((_, id) => { if(!cur.has(id)) del.push(id); });
    if(upsert.length || del.length){ ops[c] = {upsert, delete: del}; any = true; }
  });
  const metaChanged = JSON.stringify(DB.meta||{}) !== syncSnapshot.meta;
  return (any || metaChanged) ? ops : null;
}
function mergeOps(a, b){
  if(!a) return b; if(!b) return a;
  const out = {};
  new Set([...Object.keys(a), ...Object.keys(b)]).forEach(c => {
    const up = new Map(); const del = new Set();
    [a[c], b[c]].forEach(op => { if(!op) return;
      (op.delete||[]).forEach(id => { del.add(id); up.delete(id); });
      (op.upsert||[]).forEach(it => { up.set(it.id, it); del.delete(it.id); });
    });
    out[c] = {upsert: [...up.values()], delete: [...del]};
  });
  return out;
}
function setSync(state){
  const el = document.getElementById('syncLabel'); if(!el) return;
  if(!apiMode){ el.innerHTML = '<span class="inline-block w-2 h-2 rounded-full bg-slate-300 mr-1"></span>เก็บในเครื่องนี้'; return; }
  const map = {ok:['bg-emerald-500','ซิงค์แล้ว'], saving:['bg-amber-400','กำลังบันทึก...'], offline:['bg-red-500','ออฟไลน์ — รอส่งข้อมูล']};
  const [c, t] = map[state] || map.ok;
  el.innerHTML = '<span class="inline-block w-2 h-2 rounded-full '+c+' mr-1"></span>'+t;
}
function schedulePush(){ clearTimeout(pushTimer); pushTimer = setTimeout(pushNow, 400); }
async function pushNow(){
  if(!apiMode || !syncSnapshot || !DB) return;
  if(pushing){ await pushing; return pushNow(); }
  clearTimeout(pushTimer); pushTimer = null;
  const ops = mergeOps(pendingOps, computeOps());
  pendingOps = null;
  (DB.users||[]).forEach(u => { delete u.new_password; });
  syncSnapshot = takeSnapshot(DB);
  if(!ops) { clearPendingLocally(); setSync('ok'); return; }
  setSync('saving');
  pushing = (async () => {
    try{
      const {status, ok, j} = await api('sync', {ops, meta: DB.meta||{}});
      if(status === 401 || j.error === 'unauthorized'){ savePendingLocally(ops); toast('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่ (งานที่ยังไม่ได้ส่งจะถูกส่งหลังเข้าสู่ระบบ)','error'); currentUser = null; showLogin(); return; }
      if(!ok || !j.ok) throw new Error(j.error || ('HTTP '+status));
      if(!pendingOps) clearPendingLocally();
      setSync('ok');
    }catch(e){
      pendingOps = mergeOps(ops, pendingOps);
      savePendingLocally(pendingOps);
      if(e.browserCheck){ pushing = null; recoverFromBrowserCheck(); return; }
      setSync('offline');
      clearTimeout(retryTimer); retryTimer = setTimeout(pushNow, 5000);
    }finally{ pushing = null; }
  })();
  return pushing;
}
async function flushPush(){ if(pushTimer || pushing || pendingOps) await pushNow(); if(pushing) await pushing; }
async function pullDB(){
  try{
    await flushPush();
    if(pendingOps) return false; // ยังส่งไม่ได้ อย่าทับข้อมูลในเครื่อง
    const {status, j} = await api('bootstrap');

const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hash(s){ let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))>>>0; } return 'h'+h.toString(16); }
const todayISO = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const fmtDate = iso => { if(!iso) return '-'; const p=iso.split('-'); if(p.length<3) return iso; return p[2]+'/'+p[1]+'/'+p[0]; };
const nowISO = () => new Date().toISOString();
const pad2 = n => String(n).padStart(2,'0');
const ymdLocal = d => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
/* timestamps are stored in UTC; show / compare them in the user's local time (Bangkok = UTC+7) */
const localDate = iso => { if(!iso) return ''; if(/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso; const d=new Date(iso); return isNaN(d) ? String(iso).slice(0,10) : ymdLocal(d); };
const localTime = iso => { if(!iso) return ''; const d=new Date(iso); return isNaN(d) ? '' : pad2(d.getHours())+':'+pad2(d.getMinutes()); };
const localDateTime = iso => iso ? fmtDate(localDate(iso))+' '+localTime(iso) : '';
const yesterdayISO = () => { const d=new Date(); d.setDate(d.getDate()-1); return ymdLocal(d); };
function debounce(fn,ms){ let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,a),ms); }; }
function toast(msg,type){
  type=type||'success';
  const el=document.createElement('div');
  el.className='toast '+type;
  const icon = type==='success'?'check-circle-2':type==='error'?'alert-circle':'info';
  el.innerHTML='<i data-lucide="'+icon+'" class="w-4 h-4 flex-shrink-0"></i><span>'+esc(msg)+'</span>';
  $('#toast-wrap').appendChild(el);
  if(window.lucide) lucide.createIcons();
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); },2600);
}
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).then(()=>true).catch(()=>fallback());
  }
  return Promise.resolve(fallback());
  function fallback(){ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} ta.remove(); return ok; }
}
function downloadTextFile(text, filename){
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function fetchTikTokPreview(url){
  if(!url || !/^https?:\/\//i.test(url)) return null;
  try{
    const endpoint = 'https://www.tiktok.com/oembed?url=' + encodeURIComponent(url);
    const res = await fetch(endpoint, { headers: { Accept: 'application/json' } });
    if(!res.ok) return null;
    const data = await res.json();
    return {
      title: data.title || 'TikTok video',
      thumbnail_url: data.thumbnail_url || data.thumbnail || '',
      author: data.author_name || '',
      html: data.html || ''
    };
  }catch(e){ return null; }
}

/* ---------- DB layer ---------- */
let DB = null;
function migrateDB(db){
  db.meta = (db.meta && typeof db.meta==='object' && !Array.isArray(db.meta)) ? db.meta : {};
  ['users','shops','products','worklogs','tiktoks','history','tiktok_jobs','sales','import_audits','tasks','campaigns','albums'].forEach(c => { if(!Array.isArray(db[c])) db[c] = []; });
  db.sales.forEach(r => { if(!r.id) r.id = uid(); });
  db.history.forEach(h => { if(!h.id) h.id = uid(); });
  if(db.history.length > 3000) db.history.length = 3000;
  db.users.forEach(u => normalizeUserShopAccessFor(db, u));
  syncPlatforms(db);
  return db;
}
function loadDB(){
  DB = null;
  try{ const raw = localStorage.getItem(LS_KEY); if(raw){ DB = JSON.parse(raw); } }catch(e){}
  if(!DB || typeof DB !== 'object'){ DB = seedDB(); }
  migrateDB(DB);
  saveDB();
}
function renderCurrentView(){
  const renderers = {dashboard:renderDashboard, check:renderCheck, tiktokjobs:renderTikTokJobs, skulist:renderSkuList, import:renderImport, importfix:renderImportFix, mywork:renderMyWork, tasks:renderTasks, campaigns:renderCampaigns, gallery:renderGallery, report:renderReport, users:renderUsers, shops:renderShops, settings:renderSettings};
  const renderer = renderers[currentView] || renderDashboard;
  if(typeof renderer === 'function') renderer();
  if(currentUser) renderNav();
}
function ensureDailyResetState(){
  if(!DB) return;
  const today = todayISO();
  DB.meta = DB.meta || {};
  const lastReset = DB.meta.lastDailyReset || null;
  if(lastReset !== today){
    DB.meta.lastDailyReset = today;
    if(typeof reportDate !== 'undefined') reportDate = today;
    if(typeof myWorkDate !== 'undefined') myWorkDate = today;
    if(typeof listState !== 'undefined' && listState && listState.date && listState.date !== 'all'){
      listState.date = today;
    }
    saveDB();
    renderCurrentView();
  }
}
function isUserBusy(){
  if(currentView==='import' || currentView==='importfix' || currentView==='addsku') return true;
  if(currentView==='check' && typeof importPreview !== 'undefined' && importPreview) return true;
  if(document.querySelector('#modalRoot .modal-bg')) return true;
  const a=document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return true;
  return false;
}
/* อัปเดตเบื้องหลัง: วาดหน้าใหม่แบบไม่มีเอฟเฟกต์จางเข้า (ไม่งั้นหน้าจอกระพิบทุกครั้งที่ซิงค์) */
function renderCurrentViewQuiet(){
  const y = window.scrollY;
  renderCurrentView();
  document.querySelectorAll('#view .fade-in').forEach(el => el.classList.remove('fade-in'));
  if(window.lucide) lucide.createIcons();
  window.scrollTo(0, y);
}
let lastRefreshAt = 0;
async function refreshRuntimeState(){
  if(isUserBusy()) return;
  const now = Date.now();
  if(now - lastRefreshAt < 10000) return; // สลับหน้าต่างไปมา (focus) ไม่ต้องดึงถี่กว่า 10 วินาที
  lastRefreshAt = now;
  const before = DB ? JSON.stringify(DB) : '';
  const userBefore = currentUser ? JSON.stringify(currentUser) : '';
  try{
    if(apiMode){
      if(!(await pullDB())) return;
    }else{
      loadDB();
    }
    if(currentUser){
      const freshUser = (DB.users || []).find(u => u.id === currentUser.id && u.active);
      if(!freshUser){ toast('บัญชีของคุณถูกปิดใช้งาน','error'); logout(); return; }
      if(freshUser){
        currentUser = freshUser;
        normalizeUserShopAccess(currentUser);
        try{ sessionStorage.setItem(SESS_KEY, currentUser.id); }catch(e){}
      }
    }
    ensureDailyResetState();
    // วาดใหม่เฉพาะเมื่อข้อมูลเปลี่ยนจริง
    if(currentUser && (JSON.stringify(DB) !== before || JSON.stringify(currentUser) !== userBefore)) renderCurrentViewQuiet();
  }catch(e){}
}
let saveErrorShown = null;
function saveDB(){
  if(currentUser && document.getElementById('navMenu')) setTimeout(renderNav, 0); // ตัวเลขแจ้งเตือนที่เมนูอัปเดตทันที
  if(apiMode){ schedulePush(); return; }
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); saveErrorShown = null; }
  catch(e){
    const quota = e && (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED' || e.code === 22 || e.code === 1014);
    const kind = quota ? 'quota' : 'unavailable';
    if(saveErrorShown === kind) return; // แจ้งครั้งเดียว ไม่ให้ toast ซ้อนกันทุกครั้งที่บันทึก
    saveErrorShown = kind;
    toast(quota ? 'ไม่สามารถบันทึกข้อมูล (พื้นที่เบราว์เซอร์เต็ม) — กรุณา Export สำรองแล้วล้างประวัติ'
                : 'เบราว์เซอร์ไม่อนุญาตให้บันทึกข้อมูล (เช่น โหมดไม่ระบุตัวตน หรือเปิดไฟล์แบบพิเศษ) — ข้อมูลจะหายเมื่อปิดหน้า','error');
  }
}
function logHistory(action, detail){
  DB.history.unshift({id:uid(), user_id: currentUser?currentUser.id:null, action, detail:detail||'', at:nowISO()});
  if(DB.history.length > 3000) DB.history.length = 3000;
}

/* ---------- auth / session ---------- */
let currentUser = null;
function restoreSession(){
  try{ const sid = sessionStorage.getItem(SESS_KEY); if(sid){ currentUser = DB.users.find(u=>u.id===sid && u.active)||null; } }catch(e){}

async function login(username, password){
  if(apiMode){
    try{
      const {j} = await api('login', {username, password});
      if(j&&j.ok){ setToken(j.token); currentUser=j.user; syncSnapshot=null; pendingOps=null; await pullDB(); normalizeUserShopAccess(currentUser); return true; }
      return false;
    }catch(e){ if(e.browserCheck){ recoverFromBrowserCheck(); } else toast('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาลองใหม่','error'); return false; }
  }
  const u = DB.users.find(x=>x.active && (x.username.toLowerCase()===username.toLowerCase()));
  if(u && u.pass===hash(password)){ currentUser=u; normalizeUserShopAccess(currentUser); sessionStorage.setItem(SESS_KEY, u.id); return true; }
  return false;
}
async function logout(){
  if(apiMode){ try{ await flushPush(); await api('logout'); }catch(e){} setToken(''); }

const isAdmin = () => currentUser && currentUser.role==='Admin';
function normalizeUserShopAccessFor(db, user){
  if(!user) return;
  if(!Array.isArray(user.shop_ids)) user.shop_ids = [];
  if(user.role === 'Admin') user.shop_ids = (db.shops||[]).filter(s=>s.active).map(s=>s.id);
  else user.shop_ids = user.shop_ids.filter(id => (db.shops||[]).some(s => s.id === id));
}
function normalizeUserShopAccess(user){ if(DB) normalizeUserShopAccessFor(DB, user); }
function getAssignedShopIds(user = currentUser){
  if(!user) return [];
  const ids = Array.isArray(user.shop_ids) ? user.shop_ids : [];
  if(user.role === 'Admin') return DB.shops.filter(s=>s.active).map(s=>s.id);
  return DB.shops.filter(s=>s.active && ids.includes(s.id)).map(s=>s.id);
}
function canAccessShop(shopId, user = currentUser){
  if(!shopId || !user) return false;
  if(user.role === 'Admin') return true;
  return getAssignedShopIds(user).includes(shopId);
}
function getVisibleShopsForUser(user = currentUser){
  if(!user) return [];
  const ids = getAssignedShopIds(user);
  return DB.shops.filter(s=>s.active && ids.includes(s.id));
}
function getVisibleTikTokShopCodes(user = currentUser){
  const visible = getVisibleShopsForUser(user).filter(s=>s.platform === 'TikTok');
  return Array.from(new Set(visible.map(s=>s.code)));
}
function canAccessTikTokShop(shopCode, user = currentUser){
  if(!shopCode) return false;
  if(isAdmin()) return true;
  return getVisibleTikTokShopCodes(user).includes(String(shopCode));
}

/* mark work: status = 'done' | 'progress' | 'pending' */
function markWork(pid, platform, shopId, status){
  if(!isAdmin() && !canAccessShop(shopId)){
    toast('ร้านนี้ไม่ได้รับมอบหมายให้คุณ','error');
    return;
  }
  let w = getWorklog(pid, platform, shopId);
  const was = w ? w.status : 'pending';
  if(!w){
    w = {id:uid(), product_id:pid, platform:platform, shop_id:shopId, user_id:currentUser.id, status:status,
         bigseller_done:false, bigseller_by:null, bigseller_at:null,
         work_date:todayISO(), created_at:nowISO(), updated_at:nowISO()};
    DB.worklogs.push(w);
  } else {
    w.status = status;
    w.user_id = currentUser.id;
    w.work_date = todayISO();
    w.updated_at = nowISO();
  }
  logHistory('mark_'+status, productById(pid)?.sku+' @ '+platform+'/'+shopById(shopId)?.code+' ('+was+'→'+status+')');
  saveDB();
}
function toggleBigseller(w){
  if(!w) return;
  if(!isAdmin() && !canAccessShop(w.shop_id)){
    toast('คุณไม่มีสิทธิ์ปรับ BigSeller สำหรับร้านนี้','error');
    return;
  }
  w.bigseller_done = !w.bigseller_done;
  w.bigseller_by = w.bigseller_done ? currentUser.id : null;
  w.bigseller_at = w.bigseller_done ? nowISO() : null;
  w.updated_at = nowISO();
  logHistory('bigseller_'+(w.bigseller_done?'on':'off'), productById(w.product_id)?.sku+' @ '+w.platform);
  saveDB();
}
function saveTiktok(w, url){
  if(!isAdmin() && !canAccessShop(w.shop_id)){
    toast('คุณไม่มีสิทธิ์บันทึกลิงก์ TikTok สำหรับร้านนี้','error');
    return false;
  }
  const trimmed = String(url||'').trim();
  if(!trimmed || !/^https?:\/\//i.test(trimmed)){
    toast('ลิงก์ TikTok ไม่ถูกต้อง ต้องเริ่มด้วย http:// หรือ https://','error');

  let t = tiktokOf(w.id);

function openTiktokUrlDialog(defaultUrl, onSave){
  const modal = document.createElement('div');
  modal.className='modal-bg';
  modal.innerHTML = `
    <div class="card w-full max-w-md p-5 fade-in">
      <div class="flex items-start justify-between mb-4">
        <div>
          <p class="text-xs text-slate-400 font-medium">ส่งงาน TikTok</p>
          <h3 class="text-xl font-bold">แนบลิงก์ URL</h3>
        </div>
        <button class="btn btn-ghost btn-sm" data-close-tiktok-url>ปิด</button>
      </div>
      <label class="text-sm font-medium text-slate-600 mb-2 block">ลิงก์ TikTok</label>
      <input id="tiktokUrlInput" class="input" type="url" value="${esc(defaultUrl||'')}" placeholder="https://www.tiktok.com/@user/video/1234567890" autofocus>
      <div class="flex gap-2 mt-4">
        <button class="btn btn-ghost flex-1" data-close-tiktok-url>ยกเลิก</button>
        <button class="btn btn-primary flex-1" data-confirm-tiktok-url>บันทึก URL</button>
      </div>
    </div>`;
  const input = modal.querySelector('#tiktokUrlInput');
  const commit = () => {
    const value = (input.value || '').trim();
    if(!/^https?:\/\//i.test(value)){
      toast('ลิงก์ TikTok ไม่ถูกต้อง ต้องเริ่มด้วย http:// หรือ https://','error');
      input.focus();
      return;
    }
    modal.remove();
    onSave(value);
  };
  modal.addEventListener('click', e => {
    if (e.target === modal || e.target.closest('[data-close-tiktok-url]')) {
      modal.remove();
      return;
    }
    if (e.target.closest('[data-confirm-tiktok-url]')) commit();
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') commit();
  });
  $('#modalRoot').appendChild(modal);
  input.focus();
  input.select();
}

async function offerLocalImport(){
  if(!apiMode || !isAdmin() || !DB || (DB.meta && DB.meta.local_imported)) return;
  let local = null;
  try{ if(localStorage.getItem('sku_skip_local_import')) return; local = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); }catch(e){ return; }
  if(!local || !Array.isArray(local.products)) return;
  const nWork = (local.worklogs || []).filter(w => !w.demo).length, nTask = (local.tasks || []).length;
  if(!confirm('พบข้อมูลที่เคยเก็บไว้ในเบราว์เซอร์นี้\nSKU '+local.products.length+' · งานที่ทำ '+nWork+' · ติดตามงาน '+nTask+'\n\nย้ายขึ้นเซิร์ฟเวอร์ให้ทุกคนใช้ข้อมูลชุดนี้ร่วมกันไหม?\n(ทำได้ครั้งเดียว — กด ยกเลิก ถ้าเบราว์เซอร์นี้ไม่ใช่เครื่องที่มีข้อมูลล่าสุด)')){
    try{ localStorage.setItem('sku_skip_local_import', '1'); }catch(e){}
    return;
  }
  try{
    const {j} = await api('import_local', {db: local});
    if(!j.ok){ toast(j.error || 'ย้ายข้อมูลไม่สำเร็จ', 'error'); return; }
    syncSnapshot = null; pendingOps = null;
    if(await pullDB()){ currentUser = DB.users.find(u => u.id === currentUser.id) || currentUser; renderNav(); renderCurrentView(); }
    toast('ย้ายข้อมูลขึ้นเซิร์ฟเวอร์แล้ว — ทุกคนเห็นข้อมูลชุดเดียวกัน');
  }catch(e){ toast('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ลองใหม่ภายหลัง', 'error'); }
}

const SKU_SIZE_RE = /^(Y?(XXXS|XXS|XS|S|M|L|XL|XXL|XXXL|XXXXL|[2-9]XL|[2-9]L)|SS|F|FS|FREE|FREESIZE|ONESIZE|OS)$/; // Y = ไซส์เด็ก เช่น YS, YXL
const SKU_COLOR_RE = /^(DARK|LIGHT|NEON|D|L)?(BLACK|WHITE|RED|BLUE|GREEN|YELLOW|ORANGE|PINK|PURPLE|BROWN|GREY|GRAY|NAVY|BEIGE|CREAM|KHAKI|GOLD|SILVER|TEAL|INDIGO|MAROON|CORAL|WINE|MINT|LIME|AQUA|OFFWHITE|IVORY|SKY|SKYBLUE|ROYAL|ROYALBLUE|CHARCOAL|OLIVE)$/;
let _knownSkuCache = {n:-1, set:null};
function knownSkuSet(){
  const list = (typeof DB!=='undefined' && DB && Array.isArray(DB.products)) ? DB.products : [];
  if(_knownSkuCache.n !== list.length){
    _knownSkuCache = {n:list.length, set:new Set(list.map(p=>String(p.sku||'').trim().toUpperCase()))};
  }
  return _knownSkuCache.set;
}
function stripSkuVariant(parts){
  const out = parts.slice();
  let strippedSize = false, strippedCode = false;
  while(out.length > 1){
    const raw = out[out.length-1];
    const t = raw.toUpperCase().replace(/[()\[\]\s.]/g,'');
    if(!t || SKU_SIZE_RE.test(t)){ out.pop(); strippedSize = true; continue; }
    if(/[฀-๿]/.test(raw) || SKU_COLOR_RE.test(t)){ out.pop(); continue; }       // สีภาษาไทย / สีอังกฤษ
    if(strippedSize && !strippedCode && /^[A-Z]{1,3}$/.test(t)){ out.pop(); strippedCode = true; continue; } // รหัสสีสั้น เช่น PH, BK
    break;
  }
  return out;
}
/* ส่วนที่ถูกตัดออกจาก SKU → สี / ไซส์  เช่น YS001-เทา-YXL → {colors:[เทา], sizes:[YXL]} */
const SIZE_RANK = s => {
  const t = String(s).toUpperCase(), youth = /^Y(?!$)/.test(t) && SKU_SIZE_RE.test(t) ? 1 : 0, core = youth ? t.slice(1) : t;
  const order = {XXXS:0, XXS:1, XS:2, S:3, M:4, L:5, XL:6, XXL:7, '2XL':7, '2L':7, XXXL:8, '3XL':8, '3L':8, XXXXL:9, '4XL':9, '4L':9};
  const n = core.match(/^([5-9])X?L$/); const r = n ? 5 + Number(n[1]) : order[core];
  return r === undefined ? 1000 : (youth ? r - 100 : r); // ไซส์เด็กมาก่อน, ไซส์ไม่รู้จัก/FREE ไว้ท้าย
};
const sortSizes = list => [...new Set(list)].sort((a, b) => SIZE_RANK(a) - SIZE_RANK(b) || String(a).localeCompare(String(b)));
function sizeRangeLabel(list){
  const s = sortSizes(list);
  return s.length > 2 ? s[0] + '–' + s[s.length - 1] : s.join(', ');
}
function skuVariantParts(raw, base){
  const parts = String(raw || '').split(/\s*-\s*/).map(x => x.trim()).filter(Boolean);
  const rest = parts.slice(String(base || '').split(/\s*-\s*/).filter(Boolean).length);
  const colors = [], sizes = [];
  rest.forEach(x => (SKU_SIZE_RE.test(x.toUpperCase().replace(/[()\[\]\s.]/g, '')) ? sizes : colors).push(x));
  return {colors, sizes};
}
function normalizeBaseSku(sku){
  const raw = String(sku || '').trim();
  if(!raw) return raw;
  const parts = raw.split(/\s*-\s*/).map(p=>p.trim()).filter(Boolean);
  if(parts.length <= 1) return raw;
  const ruleBase = stripSkuVariant(parts).join('-');
  const known = knownSkuSet();
  if(known.has(ruleBase.toUpperCase())) return ruleBase;
  // ถ้าไม่ตรง ลองหา SKU ที่มีในระบบซึ่งเป็นส่วนต้นของ SKU นี้ (ยาวสุดก่อน)
  for(let k = parts.length; k >= 1; k--){
    const cand = parts.slice(0,k).join('-');
    if(known.has(cand.toUpperCase())) return cand;
  }
  return ruleBase;
}
function skuProblem(baseSku){
  const v = String(baseSku||'').trim();
  if(!v) return 'SKU ว่าง / ไม่มีข้อมูล';
  if(/[฀-๿]/.test(v)) return 'SKU มีตัวอักษรภาษาไทย (อาจใส่ชื่อสินค้าแทน SKU)';
  if(v.length > 60) return 'SKU ยาวเกิน 60 ตัวอักษร';
  if(/[^A-Za-z0-9\-\/ ._]/.test(v)) return 'SKU มีอักขระที่ไม่รองรับ';
  return '';
}
const rowHasData = r => Object.values(r||{}).some(v => String(v??'').trim() !== '');

function getTopSellingProducts(platform='Shopee', limit=6){
  const qtyBySku = {};
  const salesRows = Array.isArray(DB.sales) ? DB.sales.filter(s => s && s.platform === platform && s.sku) : [];
  salesRows.forEach(item => {
    const rawSku = String(item.sku).trim();
    const sku = normalizeBaseSku(rawSku);
    const qty = Number(item.quantity ?? item.qty ?? item.count ?? 0);
    if(!sku || !Number.isFinite(qty) || qty <= 0) return;
    qtyBySku[sku] = (qtyBySku[sku] || 0) + qty;
  });

  if(Object.keys(qtyBySku).length){
    return Object.entries(qtyBySku)
      .map(([sku, soldQty]) => {
        const product = DB.products.find(p => String(p.sku).trim().toLowerCase() === sku.trim().toLowerCase()) || DB.products.find(p => normalizeBaseSku(p.sku).toLowerCase() === sku.trim().toLowerCase());
        return {
          pid: product?.id || sku,
          sku,
          brand: product?.brand || '—',
          count: soldQty,
          bigseller: 0,
          name: product?.name || ''
        };
      })
      .sort((a, b) => b.count - a.count)
      .slice(0, limit);
  }

  const counts = {};
  DB.worklogs.filter(w => w.status === 'done' && w.platform === platform).forEach(w => {
    const pid = w.product_id;
    if(!pid) return;
    counts[pid] = (counts[pid] || 0) + 1;
  });

  return Object.entries(counts)
    .map(([pid, count]) => {
      const product = productById(pid);
      return {
        pid,
        sku: product?.sku || '-',
        brand: product?.brand || '-',
        count,
        bigseller: 0,
        name: product?.name || ''
      };
    })
    .sort((a, b) => b.count - a.count)
    .slice(0, limit);
}

let officialNewsTimer = null;

function stopNewsAutoplay(){
  if (officialNewsTimer) {
    clearInterval(officialNewsTimer);
    officialNewsTimer = null;
  }
}

function bindNewsHoverState(){
  const shell = document.querySelector('[data-official-news-shell]');
  if (!shell || shell.dataset.newsBound === 'true') return;
  shell.dataset.newsBound = 'true';
  shell.addEventListener('mouseenter', () => stopNewsAutoplay());
  shell.addEventListener('mouseleave', () => startNewsAutoplay());
}

function startNewsAutoplay(){
  stopNewsAutoplay();
  const track = document.getElementById('officialNewsTrack');
  if (!track || !track.children.length) return;
  bindNewsHoverState();
  officialNewsTimer = setInterval(() => {
    const total = track.children.length || 1;
    const nextIndex = (Number(track.dataset.index || 0) + 1) % total;
    updateNewsCarousel(nextIndex);
  }, 4500);
}

function updateNewsCarousel(index){
  const track = document.getElementById('officialNewsTrack');
  if(!track) return;
  const total = track.children.length || 1;
  const nextIndex = ((index % total) + total) % total;
  track.dataset.index = String(nextIndex);
  track.style.transform = `translateX(-${nextIndex * 100}%)`;
  const progress = document.getElementById('officialNewsProgress');
  if (progress) {
    progress.style.width = `${((nextIndex + 1) / total) * 100}%`;
  }
  document.querySelectorAll('[data-news-dot]').forEach(dot => {
    const active = Number(dot.dataset.newsDot) === nextIndex;
    dot.classList.toggle('bg-brand-600', active);
    dot.classList.toggle('bg-slate-300', !active);
    dot.classList.toggle('scale-110', active);
  });
}

  const previewInner = modal.querySelector('#tiktokJobPreviewInner');

    const value = (urlInput.value || '').trim();
    if(!/^https?:\/\//i.test(value)) { previewBox.classList.add('hidden'); return; }
    const meta = await fetchTikTokPreview(value);
    if(!meta || !meta.thumbnail_url){
      previewBox.classList.remove('hidden');
      previewInner.innerHTML = `
        <div class="rounded-lg border border-dashed border-slate-300 bg-white p-3 text-center text-slate-500 text-sm">
          <div class="font-semibold text-slate-600 mb-2">วิดีโอ TikTok</div>

    previewInner.innerHTML = `

          <div class="text-[11px] text-slate-500">${esc(meta.author || 'TikTok creator')}</div>

      </div>

  urlInput.addEventListener('input', debounce(refreshPreview, 500));
  modal.addEventListener('click', e => {
    if (e.target === modal || e.target.closest('[data-close-tiktok-job]')) {
      modal.remove();
      return;
    }
    if (e.target.closest('[data-confirm-tiktok-job]')) {
      const shop = modal.querySelector('#tiktokShopSelect').value;
      if(!canAccessTikTokShop(shop, currentUser)){
        toast('ร้าน TikTok นี้ไม่ได้รับมอบหมายให้คุณ','error');

        urlInput.focus();
        return;

      const previewMeta = fetchTikTokPreview(url).then(meta => meta && meta.thumbnail_url ? meta.thumbnail_url : '');
      previewMeta.then(thumbnail => {
        if(!Array.isArray(DB.tiktok_jobs)) DB.tiktok_jobs = [];
        DB.tiktok_jobs.unshift({
          id: uid(),
          shop: shop,
          url: url,
          status: 'pending',
          created_by: currentUser.id,
          created_at: nowISO(),
          preview_url: thumbnail
        });

        saveDB();

        renderTikTokJobs();

        DB.tiktok_jobs.unshift({ id: uid(), shop: shop, url: url, status: 'pending', created_by: currentUser.id, created_at: nowISO(), preview_url: '' });

        saveDB();
        modal.remove();
        renderTikTokJobs();
        toast('ส่งงาน TikTok เรียบร้อย');
      });
    }
  });
  $('#modalRoot').appendChild(modal);
  urlInput.focus();
}

document.addEventListener('click', e => {

  if(e.target.closest('[data-toggle-import]')){

});

              <td class="text-xs whitespace-nowrap" title="${esc(sortSizes(p.sizes||[]).join(', '))}">${(p.sizes||[]).length ? esc(sizeRangeLabel(p.sizes)) : '<span class="text-slate-300">-</span>'}</td>

                  : `${st!=='progress'?`<button class="btn btn-ghost btn-sm" data-mark-progress="${p.id}" title="กำลังทำ"><i data-lucide="loader" class="w-3.5 h-3.5"></i></button>`:''}`
                }

        </tbody>

  </div>`;
  if(keepImportHtml && $('#importResult')) $('#importResult').innerHTML = keepImportHtml;

let listState = {q:'', platform:'all', shopId:'all', status:'all', bs:'all', userId:'all', date:'all', page:1};
const PAGE_SIZE = 50;
function renderSkuList(){
  const q = listState.q.trim().toLowerCase();
  const visibleShopIds = getAssignedShopIds(currentUser);
  let rows = [];
  // build rows from worklogs + products (for filters)
  DB.products.filter(p=>p.active).forEach(p=>{
    if(q && !(p.sku||'').toLowerCase().includes(q) && !(p.name||'').toLowerCase().includes(q) && !(p.brand||'').toLowerCase().includes(q)) return;
    // for each platform/shop combo that has a worklog OR show product once if no filters
    if(listState.platform==='all' && listState.shopId==='all' && listState.status==='all' && listState.bs==='all' && listState.userId==='all' && listState.date==='all'){
      rows.push({p, platform:null, shopId:null, w:null});
    } else {
      const wls = DB.worklogs.filter(w=>w.product_id===p.id && (isAdmin() || visibleShopIds.includes(w.shop_id)));
      if(wls.length===0) rows.push({p, platform:null, shopId:null, w:null});
      wls.forEach(w=>rows.push({p, platform:w.platform, shopId:w.shop_id, w}));
    }
  });
  // filters
  rows = rows.filter(r=>{
    if(!isAdmin() && r.shopId && !visibleShopIds.includes(r.shopId)) return false;
    if(listState.platform!=='all' && r.platform!==listState.platform) return false;
    if(listState.shopId!=='all' && r.shopId!==listState.shopId) return false;
    const st = r.w?r.w.status:'pending';
    if(listState.status!=='all' && st!==listState.status) return false;
    if(listState.bs!=='all'){ const bs = r.w?r.w.bigseller_done:false; if(listState.bs==='done'&&!bs) return false; if(listState.bs==='pending'&&bs) return false; }
    if(listState.userId!=='all' && (!r.w || r.w.user_id!==listState.userId)) return false;
    if(listState.date!=='all' && (!r.w || r.w.work_date!==listState.date)) return false;
    return true;
  });
  const totalPages = Math.max(1, Math.ceil(rows.length/PAGE_SIZE));
  if(listState.page>totalPages) listState.page=totalPages;
  const pageRows = rows.slice((listState.page-1)*PAGE_SIZE, listState.page*PAGE_SIZE);
  const shopOpts = (listState.platform==='all' ? DB.shops : DB.shops.filter(s=>s.platform===listState.platform)).filter(s=>isAdmin() || visibleShopIds.includes(s.id));

          <option value="all">Platform: ทั้งหมด</option>${PLATFORMS.map(p=>`<option ${listState.platform===p?'selected':''}>${p}</option>`).join('')}
        </select>
        <select id="lstShop" class="input">
          <option value="all">ร้าน: ทั้งหมด</option>${shopOpts.map(s=>`<option value="${s.id}" ${listState.shopId===s.id?'selected':''}>${esc(s.code)}</option>`).join('')}
        </select>
        <select id="lstStatus" class="input">
          <option value="all">สถานะ: ทั้งหมด</option>
          <option value="done" ${listState.status==='done'?'selected':''}>ทำแล้ว</option>
          <option value="pending" ${listState.status==='pending'?'selected':''}>ยังไม่ได้ทำ</option>
          <option value="progress" ${listState.status==='progress'?'selected':''}>กำลังทำ</option>
        </select>
        <select id="lstBs" class="input">
          <option value="all">BigSeller: ทั้งหมด</option>
          <option value="done" ${listState.bs==='done'?'selected':''}>ลงแล้ว</option>
          <option value="pending" ${listState.bs==='pending'?'selected':''}>ยังไม่ลง</option>
        </select>
        <select id="lstUser" class="input">
          <option value="all">คนทำ: ทั้งหมด</option>
          <option value="${currentUser.id}" ${listState.userId===currentUser.id?'selected':''}>— ฉัน (${esc(currentUser.name)}) —</option>
          ${isAdmin()?DB.users.filter(u=>u.active&&u.id!==currentUser.id).map(u=>`<option value="${u.id}" ${listState.userId===u.id?'selected':''}>${esc(u.name)}</option>`).join(''):''}
        </select>
        <select id="lstDate" class="input">
          <option value="all">วันที่: ทั้งหมด</option>

    <div class="card overflow-hidden">
      <div class="px-4 py-3 border-b text-sm text-slate-500" style="border-color:var(--border);">รวม <b class="badge-num">${rows.length}</b> รายการ · หน้า ${listState.page}/${totalPages}</div>

  if(window.lucide) lucide.createIcons();

function openEditProduct(pid){
  const p = productById(pid); if(!p) return;
  const brands = [...new Set(DB.products.map(x=>x.brand).filter(Boolean))].sort();
  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.innerHTML = `
    <div class="card w-full max-w-md p-5 fade-in">
      <div class="flex items-start justify-between mb-4">
        <div><p class="text-xs text-slate-400 font-medium">แก้ไขสินค้า</p><h3 class="text-xl font-bold font-mono">${esc(p.sku)}</h3></div>
        <button class="btn btn-ghost btn-sm" data-close-edit>ปิด</button>
      </div>
      <div class="space-y-3">
        <div><label class="text-sm font-medium text-slate-600 mb-1 block">SKU <span class="text-red-500">*</span></label>
          <input id="editSku" class="input font-mono" value="${esc(p.sku)}"></div>
        <div><label class="text-sm font-medium text-slate-600 mb-1 block">แบรนด์</label>
          <input id="editBrand" class="input" value="${esc(p.brand||'')}" list="editBrandList">
          <datalist id="editBrandList">${brands.map(b=>`<option value="${esc(b)}">`).join('')}</datalist></div>
        <p class="text-[11px] text-slate-400">งานที่ทำไว้, BigSeller และลิงก์ TikTok ของ SKU นี้จะยังอยู่ครบหลังแก้ไข · ระบบตัดสี/ไซส์ออกให้อัตโนมัติ</p>
      </div>
      <div class="flex gap-2 mt-5">
        <button class="btn btn-ghost flex-1" data-close-edit>ยกเลิก</button>
        <button class="btn btn-primary flex-1" data-save-edit><i data-lucide="save" class="w-4 h-4"></i>บันทึก</button>
      </div>
    </div>`;
  const save = () => {
    const raw = modal.querySelector('#editSku').value.trim();
    const parts = raw.split(/\s*-\s*/).map(x=>x.trim()).filter(Boolean);
    const sku = parts.length > 1 ? stripSkuVariant(parts).join('-') : raw; // ตัดสี/ไซส์ตามกฎ ไม่อิง SKU เดิมของตัวเอง
    const brand = modal.querySelector('#editBrand').value.trim();
    const problem = skuProblem(sku);
    if(problem){ toast(problem,'error'); return; }
    const clash = DB.products.find(x => x.id !== p.id && String(x.sku||'').trim().toUpperCase() === sku.toUpperCase());
    if(clash){ toast('SKU '+sku+' มีอยู่แล้วในระบบ'+(clash.active===false?' (ถูกปิดใช้)':''),'error'); return; }
    if(sku === p.sku && brand === (p.brand||'')){ modal.remove(); return; }
    const before = p.sku + (p.brand?' ('+p.brand+')':'');
    p.sku = sku; p.brand = brand; p.updated_at = nowISO();
    logHistory('edit_product', before+' → '+sku+(brand?' ('+brand+')':''));
    saveDB();
    modal.remove();
    toast('แก้ไข SKU เรียบร้อย');
    $('#modalRoot').innerHTML = ''; renderCurrentView();
  };
  modal.addEventListener('click', e => {
    if(e.target === modal || e.target.closest('[data-close-edit]')){ modal.remove(); return; }
    if(e.target.closest('[data-save-edit]')) save();
  });
  modal.addEventListener('keydown', e => { if(e.key==='Enter') save(); });
  $('#modalRoot').appendChild(modal);
  if(window.lucide) lucide.createIcons();
  const inp = modal.querySelector('#editSku'); inp.focus(); inp.select();
}

let addSkuTab = 'bulk';
let bulkPreview = null;
function parseBulkSku(text, defaultBrand){
  const lines = String(text||'').split(/\r?\n/);
  const known = knownSkuSet();
  const seen = new Map(); const rows = [];
  lines.forEach((line, idx) => {
    if(!line.trim()) return;
    // รองรับ: วางจาก Excel (Tab), คั่นด้วย , หรือ ; หรือ |  — คอลัมน์แรก = SKU, คอลัมน์ที่สอง = แบรนด์
    const parts = line.split(/\t|,|;|\|/).map(x => x.trim());
    const raw = parts[0] || '';
    if(idx === 0 && /^sku$/i.test(raw)) return; // แถวหัวตาราง
    const brand = parts[1] || defaultBrand || '';
    const sku = normalizeBaseSku(raw);
    const row = {line: idx+1, raw, sku, brand, status: 'new', note: ''};
    const problem = skuProblem(sku);
    if(problem){ row.status = 'bad'; row.note = problem; }
    else if(seen.has(sku.toUpperCase())){ row.status = 'dup'; row.note = 'ซ้ำกับบรรทัด '+seen.get(sku.toUpperCase()); }
    else if(known.has(sku.toUpperCase())){ row.status = 'exists'; row.note = 'มีในระบบแล้ว'; }
    if(row.status !== 'bad' && !seen.has(sku.toUpperCase())) seen.set(sku.toUpperCase(), idx+1);
    rows.push(row);
  });
  return rows;
}

function handleImportFile(file){
  if(!file){
    $('#importUploadNotice').classList.remove('hidden');
    return;
  }
  showImportBusy();
  if(!window.XLSX){ hideImportBusy(); toast('ไลบรารี Excel ยังไม่พร้อม ลองใหม่อีกครั้ง','error'); return; }
  const mode = importMode || 'sku';
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = new Uint8Array(e.target.result);
      let wb;
      if(/\.csv$/i.test(file.name || '')){
        // CSV: ถอดรหัสภาษาไทยเอง (UTF-8 ก่อน ถ้าอ่านไม่ออกใช้ Windows-874 ที่ Excel ภาษาไทยใช้)
        let text = new TextDecoder('utf-8').decode(data);
        if(text.includes('\uFFFD')){ try{ text = new TextDecoder('windows-874').decode(data); }catch(_){} }
        wb = XLSX.read(text.replace(/^\uFEFF/, ''), {type:'string', raw:true});
      } else {
        wb = XLSX.read(data, {type:'array'});
      }
      const normalizeHeader = h => String(h||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
      const sheetCandidates = wb.SheetNames.map(name => ({
        name,
        rows: XLSX.utils.sheet_to_json(wb.Sheets[name], {defval:''})
      }));
      const selectedSheet = sheetCandidates.find(({rows}) => rows.length && Object.keys(rows[0] || {}).some(h => {
        const n = normalizeHeader(h);
        return /(sku|รหัสสินค้า|productsku|itemsku|merchant.*sku|สินค้า.*sku|id\s*สินค้า|id\s*product)/.test(n);
      })) || sheetCandidates[0] || {name:'', rows:[]};
      const rows = selectedSheet.rows || [];
      if(!rows.length){ toast('ไฟล์ว่างหรือไม่มีข้อมูล','error'); return; }
      const headers = Object.keys(rows[0]);
      const skuCol = headers.find(h => normalizeHeader(h).replace(/[^a-z]/g,'') === 'sku') || headers.find(h => {
        const n = normalizeHeader(h);
        if(/(ลูกค้า|คำสั่ง|ใบแจ้งหนี้|ไปรษณีย์|ประเทศ|จังหวัด|เมือง|เขต|ตำบล|พัสดุ|โลจิสติกส์|ผู้ขาย|สกุลเงิน|ชำระ|ยกเลิก|หมายเลข|เบอร์|รหัส.*ลูกค้า|รหัส.*ผู้|รหัส.*ไปรษณีย์)/.test(n)) return false;
        return /(sku|รหัสสินค้า|productsku|itemsku|merchant.*sku|สินค้า.*sku|id\s*สินค้า|id\s*product)/.test(n);
      });
      const nameCol = headers.find(h => {
        const n = normalizeHeader(h);
        return /(ชื่อสินค้า|product.*name|item.*name|สินค้า|name)/.test(n) && !/merchant|sku/.test(n);
      });
      const brandCol = headers.find(h => /(brand|แบรนด์|ยี่ห้อ)/.test(normalizeHeader(h)));
      const qtyCol = headers.find(h => {
        const n = normalizeHeader(h);
        if(/(รหัส|คำสั่ง|ลูกค้า|เบอร์|ไปรษณีย์|ประเทศ|จังหวัด|เมือง|เขต|ตำบล|ราคา|รวม|สกุลเงิน|เวลา|วันที่|สถานะ|พัสดุ|โลจิสติกส์|ผู้ขาย|ชำระ|ยกเลิก|หมายเหตุ|อ้างอิง|supplier)/.test(n)) return false;
        return /(qty|quantity|จำนวน|sold|sale|count|total)/.test(n);
      });
      if(!skuCol){ toast('ไม่พบคอลัมน์ SKU ในไฟล์ (คอลัมน์ที่มี: '+headers.join(', ')+')','error'); return; }
      const selectedShop = DB.shops.find(s => s.id === importSelectedShopId) || DB.shops[0];
      if(mode === 'sales') {
        const items = [];
        const failed = [];
        const salesQtyBySku = new Map();
        rows.forEach((r, rowIndex)=>{
          const rawSku = String(r[skuCol] || '').trim();
          const baseSku = normalizeBaseSku(rawSku);
          const rName = nameCol ? String(r[nameCol] || '').trim() : '';
          const rBrand = brandCol ? String(r[brandCol] || '').trim() : '';
          if(!rawSku && !rowHasData(r)) return; // แถวว่างทั้งแถว
          const problem = skuProblem(baseSku);
          if(problem){ failed.push({row: rowIndex + 2, sku: rawSku, baseSku, name: rName, brand: rBrand, reason: problem}); return; }
          if(!knownSkuSet().has(baseSku.toUpperCase())) failed.push({row: rowIndex + 2, sku: rawSku, baseSku, name: rName, brand: rBrand, reason: 'ไม่พบ SKU ในระบบ'});
          const skuKey = (baseSku || rawSku).toLowerCase();
          const qty = qtyCol ? Number(String(r[qtyCol] ?? '').replace(/,/g, '').replace(/[^0-9.-]/g, '')) : 1;
          const normalizedQty = Number.isFinite(qty) && qty > 0 ? qty : 1;
          if(!salesQtyBySku.has(skuKey)) salesQtyBySku.set(skuKey, { sku: baseSku || rawSku, quantity: 0 });
          salesQtyBySku.get(skuKey).quantity += normalizedQty;
          items.push({sku: rawSku, baseSku, name: nameCol ? String(r[nameCol] || '').trim() : '', brand: brandCol ? String(r[brandCol] || '').trim() : '', qty: normalizedQty});
        });
        const salesRows = Array.from(salesQtyBySku.values()).map(row => ({
          sku: row.sku,
          platform: selectedShop ? selectedShop.platform : 'Shopee',
          shop_id: selectedShop ? selectedShop.id : null,
          quantity: row.quantity,
          imported_at: nowISO()
        }));
        importPreview = {mode:'sales', file_name: file.name, items, failed, salesRows, shop_id: selectedShop ? selectedShop.id : null, platform: selectedShop ? selectedShop.platform : 'Shopee'};
        const res = $('#importResult');

        res.innerHTML = `

              <div class="text-center p-3 rounded-lg bg-slate-50"><p class="text-2xl font-extrabold badge-num">${items.length}</p><p class="text-xs text-slate-500">รายการไฟล์</p></div>
              <div class="text-center p-3 rounded-lg bg-green-50"><p class="text-2xl font-extrabold badge-num text-done">${salesRows.length}</p><p class="text-xs text-slate-500">SKU ที่รวมแล้ว</p></div>
              <div class="text-center p-3 rounded-lg bg-amber-50"><p class="text-2xl font-extrabold badge-num text-progress">${totalQty}</p><p class="text-xs text-slate-500">ยอดขายรวม</p></div>
            </div>
            <p class="text-xs text-emerald-600 mb-3">ไฟล์นี้จะถูกบันทึกเป็นข้อมูลสินค้าขายดีแบบแยกจากข้อมูลเช็ก SKU โดยตรง</p>
            ${failed.length?`<p class="text-xs text-red-600 mb-3">มี ${failed.length} แถวที่ SKU ไม่ถูกต้องหรือไม่พบในระบบ — จะถูกส่งไปหน้า "แก้ SKU นำเข้าไม่สำเร็จ" หลังกดนำเข้า</p>`:''}

/* ---------- Import failures (fix page) ---------- */
let importFixFilter = 'open';
function openImportFailures(){
  return (DB && Array.isArray(DB.import_audits)) ? DB.import_audits.filter(a => !a.status || a.status === 'open') : [];
}
/* one entry per distinct SKU: rows of the same SKU (e.g. every color/size of "ถุงเท้า H3") are merged */
function failureKey(it){
  const sku = String(it.base_sku || it.baseSku || it.sku || '').trim().toUpperCase().replace(/\s+/g,' ');
  return sku ? 'sku:'+sku : 'blank:'+String(it.name||'').trim().toUpperCase()+'|'+String(it.reason||'');
}
function dedupeImportAudits(){
  const seen = new Map(); let changed = false;
  (DB.import_audits||[]).forEach(a => {
    if(a.status && a.status !== 'open') return;
    const k = failureKey(a);
    const first = seen.get(k);
    if(!first){ seen.set(k, a); if(!Array.isArray(a.rows)) { a.rows = a.row!=null ? [a.row] : []; changed = true; } return; }
    first.rows = Array.from(new Set([...(first.rows||[]), ...(Array.isArray(a.rows)?a.rows:[a.row])].filter(r=>r!=null)));
    if(!first.name && a.name) first.name = a.name;
    if(!first.brand && a.brand) first.brand = a.brand;
    a._dup = true; changed = true;
  });
  if(changed) DB.import_audits = DB.import_audits.filter(a => !a._dup);
  return changed;
}
function recordImportFailures(preview){
  const failed = (preview && Array.isArray(preview.failed)) ? preview.failed : [];
  if(!failed.length) return 0;
  const shop = DB.shops.find(s => s.id === preview.shop_id);
  DB.import_audits = (DB.import_audits || []).concat(failed.map(it => ({
    id: uid(), file_name: preview.file_name || '', row: it.row, rows: [it.row], sku: it.sku || '', base_sku: it.baseSku || '',
    name: it.name || '', brand: it.brand || '', reason: it.reason, mode: preview.mode,
    platform: shop ? shop.platform : (preview.platform || ''), shop_code: shop ? shop.code : '',
    status: 'open', imported_at: nowISO(), created_by: currentUser ? currentUser.id : null
  })));
  dedupeImportAudits();
  DB.import_audits = DB.import_audits.slice(-1000);
  const distinct = new Set(failed.map(failureKey)).size;
  logHistory('import_failed', 'นำเข้าไม่สำเร็จ '+failed.length+' แถว ('+distinct+' SKU) — '+(preview.file_name||'-'));
  return distinct;
}
function autoResolveImportFailures(){
  let changed = false;
  openImportFailures().forEach(a => {
    const base = a.base_sku || normalizeBaseSku(a.sku || '');
    if(/ไม่พบ SKU/.test(a.reason || '') && base && knownSkuSet().has(base.toUpperCase())){
      a.status = 'fixed'; a.resolved_sku = base; a.resolved_at = nowISO(); a.note = 'มีในระบบแล้ว'; changed = true;
    }
  });
  if(changed) saveDB();
}

function saveImportFix(id){
  const a = (DB.import_audits||[]).find(x => x.id === id); if(!a) return;
  const skuIn = document.querySelector('[data-fix-sku="'+id+'"]');
  const name = (document.querySelector('[data-fix-name="'+id+'"]')?.value || '').trim();
  const brand = (document.querySelector('[data-fix-brand="'+id+'"]')?.value || '').trim();
  const sku = normalizeBaseSku((skuIn?.value || '').trim());
  const problem = skuProblem(sku);
  if(problem){ toast(problem, 'error'); skuIn && skuIn.focus(); return; }
  const ex = DB.products.find(p => String(p.sku||'').trim().toUpperCase() === sku.toUpperCase());
  if(ex){
    if(!ex.active) ex.active = true;
    if(name && !ex.name) ex.name = name;
    if(brand && !ex.brand) ex.brand = brand;
    a.note = 'มีในระบบแล้ว';
  } else {
    DB.products.push({id:uid(), sku, name, brand, created_at:nowISO(), active:true});
    a.note = 'เพิ่มเป็นสินค้าใหม่';
  }
  a.status = 'fixed'; a.resolved_sku = sku; a.resolved_at = nowISO(); a.resolved_by = currentUser ? currentUser.id : null;
  logHistory('import_fix', (a.sku||'(ว่าง)')+' → '+sku+' ('+a.note+')');
  saveDB(); toast('บันทึก '+sku+' แล้ว · '+a.note); renderNav(); renderImportFix();
}

let reportDate = todayISO();
function getTikTokReportLinks(date, userId){
  const rows = [];
  const pushIfValid = (item, sourceLabel) => {
    if(!item || !item.url) return;
    const url = String(item.url).trim();
    if(!/^https?:\/\//i.test(url)) return;
    const matchDate = localDate(item.created_at || item.work_date); 
    if(date && matchDate && matchDate !== date) return;
    if(userId && item.created_by && item.created_by !== userId) return;
    rows.push({
      url,
      shop: sourceLabel === 'job' ? (item.shop || 'TikTok') : (shopById(item.shop_id)?.code || 'TikTok'),
      created_by: item.created_by || userId || 'system'
    });
  };
  (DB.tiktok_jobs || []).forEach(job => {
    if(userId && job.created_by && job.created_by !== userId) return;
    if(date && localDate(job.created_at) !== date) return;
    pushIfValid(job, 'job');
  });
  (DB.tiktoks || []).forEach(t => {
    if(userId && t.created_by && t.created_by !== userId) return;
    if(date && localDate(t.created_at) !== date) return;
    pushIfValid(t, 'link');
  });
  return rows;
}
function buildReportText(date, userId){
  const logs = DB.worklogs.filter(w=>w.status==='done' && w.work_date===date && (!userId || w.user_id===userId));
  const byUser = {};
  logs.forEach(w=>{ (byUser[w.user_id]=byUser[w.user_id]||[]).push(w); });
  const tiktokUsers = new Set();
  (DB.tiktok_jobs || []).forEach(job => { if(job.created_by && localDate(job.created_at) === date) tiktokUsers.add(job.created_by); });
  (DB.tiktoks || []).forEach(t => { if(t.created_by && localDate(t.created_at) === date) tiktokUsers.add(t.created_by); });
  const users = userId ? [userId] : Array.from(new Set([...Object.keys(byUser), ...tiktokUsers]));
  let out = '📅 รายงานการทำงาน '+fmtDate(date)+'\n';
  let grandTotal=0, grandRemain=0;
  users.forEach(uid_=>{
    const u = userById(uid_); if(!u) return;
    const ulogs = byUser[uid_]||[];
    const ttLinks = getTikTokReportLinks(date, uid_);
    if(ulogs.length===0 && ttLinks.length===0 && userId) return;
    out += '\n👤 ผู้ทำ: '+u.name+'\n';
    out += '📦 งาน SKU ทำแล้ว: '+ulogs.length+' รายการ\n';
    PLATFORMS.forEach(plat=>{
      const plogs = ulogs.filter(w=>w.platform===plat);
      if(!plogs.length) return;
      const byShop = {};
      plogs.forEach(w=>{ const c=shopById(w.shop_id)?.code||'?'; byShop[c]=(byShop[c]||0)+1; });
      out += '🏪 '+plat+' '+Object.entries(byShop).map(([c,n])=>c+': '+n).join(' ')+'\n';
    });
    out += '🎬 TikTok ลงแล้ว: '+ttLinks.length+' คลิป\n';
    if(ttLinks.length){
      out += '🔗 ลิงก์ TikTok:\n';
      ttLinks.forEach((link, idx)=> out += '  '+(idx+1)+'. '+link.shop+': '+link.url+'\n');
    }
    const remain = DB.worklogs.filter(w=>w.user_id===uid_ && w.status!=='done' && w.work_date===date).length;
    out += 'รวมงานวันนี้: '+(ulogs.length+remain)+' SKU\n';
    out += 'เหลืองาน: '+remain+' SKU\n';
    grandTotal+=ulogs.length; grandRemain+=remain;
  });
  if(!userId){ out += '\n——————————\n📊 สรุปรวมทั้งหมด: '+grandTotal+' SKU · เหลือ '+grandRemain+' SKU'; }
  return out;
}

/* ---------- วิดีโอแคมเปญ: เดือนนี้ร้านไหนต้องลงวิดีโอกี่ตัว ----------
   ตั้งจากกลุ่ม LINE:  @Sofia Alvarez /VDO/   ตามด้วยบรรทัดละร้าน เช่น  alp 32 / dp 26
   campaigns: {kind:'target', id:'vc-<เดือน>-<ร้าน>', month, shop_id, target, note, source:'line'} */
const campState = {month: ''};
const monthNow = () => todayISO().slice(0, 7);
function shiftMonth(m, d){ const [y, mo] = m.split('-').map(Number); const t = new Date(y, mo - 1 + d, 1); return t.getFullYear() + '-' + pad2(t.getMonth() + 1); }
function fmtMonthTH(m){ const [y, mo] = m.split('-').map(Number); return new Date(y, mo - 1, 1).toLocaleDateString('th-TH', {month: 'long', year: 'numeric'}); }
const campSeenKey = () => 'sku_camp_seen_' + (currentUser ? currentUser.id : '-');
function campaignTargets(m){
  const mine = new Set(getAssignedShopIds(currentUser));
  return (DB.campaigns || []).filter(c => c.kind === 'target' && c.month === m && (isAdmin() || mine.has(c.shop_id)))
    .map(c => ({c, shop: DB.shops.find(x => x.id === c.shop_id)})).filter(x => x.shop)
    .sort((a, b) => PLATFORMS.indexOf(a.shop.platform) - PLATFORMS.indexOf(b.shop.platform) || String(a.shop.code).localeCompare(String(b.shop.code)));
}
/* 09:00 น. (เวลาไทย) ของวันถัดไป — เวลาที่บอทจะ Reply "เช็คหน่อย" หลังกดทำแล้ว */
function nextNineAmBangkok(){
  const bkk = new Date(Date.now() + 7 * 3600e3);
  return new Date(Date.UTC(bkk.getUTCFullYear(), bkk.getUTCMonth(), bkk.getUTCDate() + 1, 2, 0, 0)).toISOString();
}
function renderCampaigns(){
  if(!campState.month) campState.month = monthNow();
  const m = campState.month, targets = campaignTargets(m);

/* ข้อความ LINE แคมเปญ: /VDO/ ตั้งจำนวน · /RVDO/ ลงไปแล้ว · /DVDO/ ลบ  (คืนค่า [{code, n, shop}] ) */
/* คำสั่ง LINE ตั้งเองได้ที่ Settings (เก็บใน DB.meta.line_cmds) */
const LINE_CMD_DEFAULT = {tag:'Sofia Alvarez', vdo:'VDO', rvdo:'RVDO', dvdo:'DVDO'};
function lineCmds(){
  const c = (typeof DB !== 'undefined' && DB && DB.meta && DB.meta.line_cmds) || {}, o = {};
  Object.keys(LINE_CMD_DEFAULT).forEach(k => { o[k] = String(c[k] || '').trim() || LINE_CMD_DEFAULT[k]; });
  return o;
}
const reEsc = x => String(x).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function campTagRe(flags){ const c = lineCmds(); return new RegExp('/(' + [c.rvdo, c.dvdo, c.vdo].map(reEsc).join('|') + ')/', flags || 'i'); }
const campKindOf = msg => {
  const m = String(msg || '').match(campTagRe()); if(!m) return null;
  const c = lineCmds(), w = m[1].toLowerCase();
  return w === c.rvdo.toLowerCase() ? 'R' : w === c.dvdo.toLowerCase() ? 'D' : 'V';
};
function parseCampaignLines(text, kind){
  const out = [];
  String(text || '').replace(new RegExp('@' + reEsc(lineCmds().tag), 'ig'), ' ').replace(campTagRe('ig'), ' ').split(/\r?\n|,/).forEach(line => {
    const t = line.trim(); if(!t) return;
    const m = kind === 'D' ? t.match(/^([A-Za-z0-9]+)$/) : t.match(/^([A-Za-z0-9]+)\s*[:=\-]?\s*(\d+)\s*(วิดีโอ|คลิป|vdo|video)?$/i);
    if(!m) return;
    out.push({code: m[1], n: kind === 'D' ? 0 : Number(m[2]), shop: DB.shops.find(x => String(x.code).toUpperCase() === m[1].toUpperCase()) || null});
  });
  return out;
}
function applyCampaignRow(r, text, kind){
  kind = kind || campKindOf(text) || 'V';
  const items = parseCampaignLines(text, kind);
  if(!items.length) return null;
  const at = new Date(Number(r.id) || Date.now()), month = ymdLocal(at).slice(0, 7), iso = at.toISOString();
  const bad = items.filter(x => !x.shop).map(x => x.code), ok = [], missing = [];
  items.filter(x => x.shop).forEach(x => {
    const id = 'vc-' + month + '-' + x.shop.id, cur = DB.campaigns.find(c => c.id === id);
    if(kind === 'D'){ if(cur){ DB.campaigns = DB.campaigns.filter(c => c !== cur); ok.push(x); } else missing.push(x.code); return; }
    if(kind === 'R'){
      if(!cur){ missing.push(x.code); return; }
      cur.done = x.n; cur.updated_at = iso;
      // ยังไม่ครบ → ไม่ถือว่า "ทำแล้ว" และไม่ต้องแจ้งเช็คตอน 9 โมง (ถ้ายังไม่ได้แจ้ง)
      if(x.n < (Number(cur.target) || 0) && cur.done_at && !cur.notified_at) Object.assign(cur, {done_at: null, done_by: null, notify_at: null});
      ok.push(x); return;
    }
    if(!(x.n > 0)) return;
    const note = 'สั่งทาง LINE' + (r.sender ? ' โดย ' + r.sender : '') + ' · ' + fmtDate(ymdLocal(at));
    const line = {line_group: r.group, line_user: r.user, line_quote: r.quote, line_sender: r.sender};
    if(cur) Object.assign(cur, {target: x.n, note, updated_at: iso}, line);
    else DB.campaigns.push({id, kind: 'target', month, shop_id: x.shop.id, target: x.n, done: 0, note, source: 'line', created_by: 'line', updated_at: iso, ...line});
    ok.push(x);
  });
  const verb = kind === 'D' ? 'ลบ' : kind === 'R' ? 'ลงแล้ว' : 'ตั้ง';
  if(ok.length) logHistory('campaign_line', month + ' ' + verb + ': ' + ok.map(x => x.shop.code + (kind === 'D' ? '' : ' ' + x.n)).join(', '));
  return {month, kind, verb, ok, bad, missing};
}
function campaignToast(res){
  const parts = [res.verb + ' ' + (res.ok.map(x => x.shop.code + (res.kind === 'D' ? '' : ' ' + x.n)).join(', ') || '-')];
  if(res.bad.length) parts.push('ไม่รู้จักร้าน ' + res.bad.join(', '));
  if(res.missing.length) parts.push('เดือนนี้ยังไม่มีแคมเปญ ' + res.missing.join(', '));
  toast('แคมเปญวิดีโอ ' + fmtMonthTH(res.month) + ': ' + parts.join(' · '), res.bad.length || res.missing.length ? 'error' : 'info');
}
/* ข้อความที่ส่งต่อท้าย /VDO/ /RVDO/ /DVDO/ (ไม่มี @) ภายใน 3 นาที จากคนเดิม → ยังเป็นคำสั่งแคมเปญเดิม */
function vdoParentOf(r, rows){
  const ts = Number(r.id);
  const cands = rows.filter(x => x.group === r.group && x.user === r.user && Number(x.id) < ts && ts - Number(x.id) <= LINE_FOLLOW_MS && lineTagsTarget(x.message) && campTagRe().test(x.message));
  if(!cands.length) return null;
  const parent = cands[cands.length - 1];
  const tagBetween = rows.some(x => x.group === r.group && Number(x.id) > Number(parent.id) && Number(x.id) < ts && x.message.includes('@'));
  return tagBetween ? null : parent;
}

  if(a.includes(b) || b.includes(a)) return 1;
  const grams = x => { const g = new Set(); for(let i = 0; i < x.length - 1; i++) g.add(x.slice(i, i+2)); return g; };

async function pollLineLive(){
  if(!currentUser || !DB || lineLive.busy) return;
  lineLive.busy = true;
  try{
    const json = await gviz(LINE_LIVE_SHEET_ID, LINE_LIVE_SHEET);
    const v = (c, i) => String(c[i]?.v ?? '').trim();
    const rows = (json.table.rows || []).map(r => { const c = r.c || []; return {id:v(c,0), type:v(c,1).toUpperCase(), title:v(c,2), person:v(c,3), due:v(c,4), sender:v(c,5), message:v(c,6), group:v(c,7), user:v(c,8), quote:v(c,9)}; })
      .filter(r => r.id).sort((a, b) => Number(a.id) - Number(b.id));
    rows.forEach(r => { if(r.type === 'IMAGE') r.message = r.message.replace(/^id:/i, '').trim(); }); // Make ใส่ "id:" นำหน้า กันชีตปัดเลขยาว
    DB.meta = DB.meta || {};
    const firstRun = DB.meta.lineLastTs == null;
    let changed = false;
    if(!DB.meta.lineOnlyTagClean){
      const before = DB.tasks.length;
      DB.tasks = DB.tasks.filter(t => t.source !== 'line' || lineTagsTarget(t.line_text));
      DB.meta.lineOnlyTagClean = true; changed = true;
      if(DB.tasks.length !== before) logHistory('task_line_cleanup', 'ลบงาน LINE ที่ไม่ได้แท็ก @'+lineCmds().tag+' '+(before - DB.tasks.length)+' งาน');
    }
    // คำสั่ง /VDO/ /RVDO/ /DVDO/ เป็นแคมเปญวิดีโอ ไม่ใช่งาน — ลบงานที่เคยถูกสร้างจากคำสั่งเหล่านี้
    { const before = DB.tasks.length;
      DB.tasks = DB.tasks.filter(t => !(t.source === 'line' && campTagRe().test(t.line_text || '')));
      if(DB.tasks.length !== before) changed = true; }
    // งานที่สร้างจากการแท็กเฉยๆ / แท็ก + /หมวด/ (ก่อนมีคลังรูป) → ย้ายเป็นอัลบั้มในคลังรูป
    DB.tasks.filter(t => t.source === 'line' && t.line_text && !(t.line_extra_ids || []).length && lineAlbumCategory(t.line_text) !== null)
      .forEach(t => {
        DB.albums = DB.albums || [];
        const id = 'album-' + String(t.line_batch || t.id).replace(/^line-/, '');
        if(!DB.albums.some(a => a.id === id))
          DB.albums.push({id, category: lineAlbumCategory(t.line_text), line_group: t.line_group, line_user: t.line_user, line_sender: t.line_sender, images: t.images || [], created_at: t.created_at, updated_at: nowISO()});
        DB.tasks = DB.tasks.filter(x => x !== t);
        changed = true;
      });
    // งาน LINE ที่สร้างก่อนมีระบบต่อท้าย: ให้ batch = id ของตัวเอง จะได้รับข้อความต่อท้ายได้
    DB.tasks.forEach(t => { if(t.source === 'line' && !t.line_batch && /^line-\d+$/.test(t.id)){ t.line_batch = t.id; changed = true; } });
    rows.forEach(r => {
      const t = r.group && r.user && DB.tasks.find(x => x.id === 'line-'+r.id && (!x.line_group || (r.quote && !x.line_quote)));
      if(t){ t.line_group = r.group; t.line_user = r.user; t.line_quote = r.quote || t.line_quote || ''; t.line_sender = r.sender; changed = true; }
    });
    const last = Number(DB.meta.lineLastTs) || 0;
    const fresh = rows.filter(r => Number(r.id) > last);
    for(const r of fresh){
      if(r.type === 'IMAGE') continue;
      if(r.type !== 'DONE' && lineTagsTarget(r.message) && campTagRe().test(r.message)){
        const res = applyCampaignRow(r, r.message, campKindOf(r.message));
        if(res){ changed = true; if(!firstRun) campaignToast(res); }
        continue;
      }
      const campParent = (r.type !== 'DONE' && r.message && !r.message.includes('@')) ? vdoParentOf(r, rows) : null;
      if(campParent){
        const res = applyCampaignRow(Object.assign({}, r, {group: campParent.group, user: campParent.user, quote: campParent.quote}), r.message, campKindOf(campParent.message));
        if(res){ changed = true; if(!firstRun) campaignToast(res); }
        continue;
      }
      const albumCat = r.type !== 'DONE' ? lineAlbumCategory(r.message) : null;
      if(albumCat !== null){
        DB.albums = DB.albums || [];
        if(!DB.albums.some(a => a.id === 'album-' + r.id)){
          const at = new Date(Number(r.id)).toISOString();
          DB.albums.push({id: 'album-' + r.id, category: albumCat, line_group: r.group, line_user: r.user, line_sender: r.sender, images: [], created_at: at, updated_at: at});
          changed = true;
        }
        continue;
      }
      if(r.type !== 'DONE' && lineTagsTarget(r.message)){
        if(DB.tasks.some(t => t.id === 'line-'+r.id)) continue;
        const recent = recentLineTasks(r);
        if(recent.length && lineSameText(recent[0].line_text, r.message)) continue; // ส่งข้อความเดิมซ้ำ → งานเดิม
        const made = lineTasksFromRow(r);
        DB.tasks.push(...made); changed = true;
        made.filter(t => !firstRun && visibleTasks().includes(t)).forEach(t => toast('งานใหม่จาก LINE: '+t.title+(isAdmin() && !t.assignee_id ? ' — รอมอบหมาย' : ''), 'info'));
      }else if(r.type === 'DONE'){
        let best = null, score = 0;
        DB.tasks.filter(t => t.status !== 'done').forEach(t => {
          let sc = textSimilarity(t.title, r.title || r.message);
          if(r.person && taskPerson(t) && normText(taskPerson(t)) === normText(r.person)) sc += 0.15;
          if(sc > score){ score = sc; best = t; }
        });
        if(best && score >= 0.45){ setTaskStatus(best, 'done'); changed = true; if(!firstRun) toast('เสร็จแล้ว (จาก LINE): '+best.title); }
      }
    }
    /* ข้อความต่อท้ายที่ไม่ได้แท็กใคร จากคนเดิม ภายใน 3 นาที → ต่อเป็นรายละเอียดของงานล่าสุด
       ดูทุกแถว (ไม่ใช่แค่แถวใหม่) เพราะเบราว์เซอร์ที่ยังเปิดหน้าเก่าอาจอ่านแถวไปก่อน — แต่ละข้อความต่อได้ครั้งเดียว (line_extra_ids) */
    for(const r of rows){
      if(r.type === 'DONE' || r.type === 'IMAGE' || !r.message || r.message.includes('@') || vdoParentOf(r, rows)) continue;
      const recent = recentLineTasks(r);
      if(!recent.length) continue;
      const batchTs = Date.parse(recent[0].created_at);
      const tagBetween = rows.some(x => x.group === r.group && Number(x.id) > batchTs && Number(x.id) < Number(r.id) && x.message.includes('@')
        && !(x.user === r.user && lineSameText(x.message, recent[0].line_text))); // ส่งซ้ำข้อความเดิมไม่นับ
      const target = tagBetween ? null : recent[recent.length - 1];
      if(target && target.status !== 'done' && !(target.line_extra_ids || []).includes(r.id)){
        target.detail = (target.detail ? target.detail + '\n' : '') + r.message;
        target.line_extra_ids = [...(target.line_extra_ids || []), r.id];
        const extraAt = new Date(Number(r.id)).toISOString();
        if(String(target.updated_at || '') < extraAt) target.updated_at = extraAt;
        changed = true;
      }
    }
    /* รูปจากกลุ่ม (แถว IMAGE: message = LINE message id) → แนบกับงานของคนเดิมในกลุ่มเดิม ห่างไม่เกิน 3 นาที
       ส่งรูปก่อนหรือหลังข้อความแท็กก็ได้ · ดูทุกแถว เพราะงานอาจถูกสร้างทีหลังรูป · แต่ละรูปแนบได้ครั้งเดียว */
    for(const r of rows){
      if(r.type !== 'IMAGE' || !/^\d+$/.test(r.message) || imageOwners().some(t => (t.images || []).some(im => im.id === r.message))) continue;
      const target = lineImageTarget(r);
      if(!target) continue;
      target.images = [...(target.images || []), {id: r.message, at: new Date(Number(r.id)).toISOString()}];
      const at = new Date(Number(r.id)).toISOString();
      if(String(target.updated_at || '') < at) target.updated_at = at;
      changed = true;
    }
    if(rows.length){ const maxTs = Math.max(last, ...rows.map(r => Number(r.id) || 0)); if(maxTs !== last){ DB.meta.lineLastTs = maxTs; changed = true; } }
    if(changed){ saveDB(); if(currentView === 'tasks' && !isUserBusy()) renderCurrentViewQuiet(); }
    loadTaskImages();
    setLineLive(true, 'อัปเดต ' + new Date().toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit', second:'2-digit'}));
  }catch(e){
    setLineLive(false, 'เชื่อมต่อชีตงาน LINE ไม่ได้ (ชีตแชร์แบบ “ทุกคนที่มีลิงก์ดูได้” หรือยัง?)');
  }finally{ lineLive.busy = false; }
}

/* แอป "ติดตามงาน" ตัวเดิมสำรองเป็น array ของ {id,title,detail,person,due,priority,status,created,doneAt} */
function importLegacyTasks(list){
  const have = new Set(DB.tasks.map(t => t.id));
  const byName = new Map(DB.users.map(u => [String(u.name).trim().toLowerCase(), u.id]));
  let added = 0;
  list.forEach(o => {
    if(!o || !o.title) return;
    const id = o.id ? String(o.id) : uid();
    if(have.has(id)) return;
    const person = String(o.person || '').trim();
    const assignee = byName.get(person.toLowerCase()) || null;
    const status = TASK_STATUS[o.status] ? o.status : 'todo';
    DB.tasks.push({
      id, title: String(o.title), detail: String(o.detail || ''),
      assignee_id: assignee, person: assignee ? '' : person,
      due: /^\d{4}-\d{2}-\d{2}$/.test(o.due || '') ? o.due : '', priority: [1,2,3].includes(+o.priority) ? +o.priority : 2,
      status, done_at: status === 'done' ? (o.doneAt ? new Date(o.doneAt).toISOString() : nowISO()) : null,
      created_at: o.created ? new Date(o.created).toISOString() : nowISO(), created_by: currentUser.id, updated_at: nowISO()
    });
    have.add(id); added++;
  });
  return added;
}

/* ---------- ดึงสินค้าจาก Supabase (ตาราง products ของโปรเจกต์ร้าน: sku_merchant, brand) ---------- */
function isSecretSupabaseKey(key){
  if(/^sb_secret_/i.test(key)) return true;
  try{ const p = JSON.parse(atob(key.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); return p.role === 'service_role'; }catch(e){ return false; }
}
async function fetchRemoteProducts(url, key, onProgress){
  const base = url.replace(/\/+$/, '') + '/rest/v1/products?select=brand,sku_merchant&order=id.asc';
  const headers = {apikey: key};
  if(/^eyJ/.test(key)) headers.Authorization = 'Bearer ' + key; // คีย์ anon แบบเก่า (JWT)
  const out = [], page = 1000;
  for(let from = 0; ; from += page){
    const res = await fetch(base, {headers: {...headers, 'Range-Unit': 'items', Range: from + '-' + (from + page - 1)}, cache: 'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status + ' ' + (await res.text()).slice(0, 160));
    const rows = await res.json();
    out.push(...rows); if(onProgress) onProgress(out.length);
    if(rows.length < page) break;
  }
  return out;
}
/* ตัดสี/ไซส์ → รวมเป็น SKU หลัก แล้วเพิ่มเฉพาะที่ยังไม่มี (เติมแบรนด์ให้ SKU เดิมที่ยังว่าง) */
function mergeRemoteProducts(rows){
  const bases = new Map();
  rows.forEach(r => {
    const raw = String(r.sku_merchant || '').trim(); if(!raw) return;
    const sku = normalizeBaseSku(raw), k = sku.toUpperCase(), brand = String(r.brand || '').trim();
    const v = skuVariantParts(raw, sku);
    let cur = bases.get(k);
    if(!cur){ cur = {sku, brand, colors: new Set(), sizes: new Set()}; bases.set(k, cur); } else if(!cur.brand && brand) cur.brand = brand;
    v.colors.forEach(c => cur.colors.add(c)); v.sizes.forEach(z => cur.sizes.add(z));
  });
  const have = new Map(DB.products.map(p => [String(p.sku || '').trim().toUpperCase(), p]));
  let added = 0, updated = 0;
  bases.forEach((v, k) => {
    const p = have.get(k);
    const colors = [...v.colors], sizes = sortSizes([...v.sizes]);
    if(p){
      let touched = false;
      if(!p.brand && v.brand){ p.brand = v.brand; touched = true; }
      if(JSON.stringify(p.colors || []) !== JSON.stringify(colors) || JSON.stringify(p.sizes || []) !== JSON.stringify(sizes)){ p.colors = colors; p.sizes = sizes; touched = true; }
      if(touched){ p.updated_at = nowISO(); updated++; }
      return;
    }
    DB.products.push({id: uid(), sku: v.sku, name: '', brand: v.brand, colors, sizes, created_at: nowISO(), active: true, source: 'supabase'});
    added++;
  });
  return {bases: bases.size, added, updated};
}

  if(isSecretSupabaseKey(key)){ toast('นี่คือ secret / service_role key — ห้ามใส่ในเว็บ ใช้ Publishable key เท่านั้น', 'error'); $('#rrKey').value = ''; return; }
  btn.disabled = true;
  try{
    const rows = await fetchRemoteProducts(url, key, n => { status.textContent = 'กำลังดึง... ' + n.toLocaleString() + ' แถว'; });
    const r = mergeRemoteProducts(rows);
    DB.meta = DB.meta || {};
    DB.meta.rr_products = {url, key, last_sync: nowISO(), rows: rows.length, bases: r.bases};
    logHistory('products_sync', 'ดึงจาก Supabase ' + rows.length + ' แถว → ' + r.bases + ' SKU · เพิ่มใหม่ ' + r.added + (r.updated ? ' · อัปเดต ' + r.updated : ''));
    saveDB();
    toast('ดึงสินค้าแล้ว: ' + rows.length.toLocaleString() + ' แถว → ' + r.bases.toLocaleString() + ' SKU · เพิ่มใหม่ ' + r.added.toLocaleString());
    renderSettings();
  }catch(err){
    status.textContent = '';
    toast('ดึงสินค้าไม่สำเร็จ: ' + err.message + (/HTTP 40[13]/.test(err.message) ? ' — ตรวจ key หรือ RLS ของตาราง products ให้อ่านได้' : ''), 'error');
  }finally{ btn.disabled = false; }
});

document.addEventListener('click', e => {
  const b = e.target.closest('#lcSave,#lcReset');
  if(!b || !isAdmin()) return;
  DB.meta = DB.meta || {};
  if(b.id === 'lcReset'){
    if(!confirm('คืนคำสั่ง LINE เป็นค่าเริ่มต้น?')) return;
    delete DB.meta.line_cmds;
  }else{
    const clean = v => String(v || '').trim().replace(/^[@\/]+|\/+$/g, '').trim();
    const c = {tag: clean($('#lcTag').value), vdo: clean($('#lcVdo').value), rvdo: clean($('#lcRvdo').value), dvdo: clean($('#lcDvdo').value)};
    const words = [c.vdo || LINE_CMD_DEFAULT.vdo, c.rvdo || LINE_CMD_DEFAULT.rvdo, c.dvdo || LINE_CMD_DEFAULT.dvdo].map(x => x.toLowerCase());
    if(new Set(words).size < 3){ toast('คำสั่งแคมเปญ 3 ช่องต้องไม่ซ้ำกัน', 'error'); return; }

    if(DB.shops.some(sh => words.includes(String(sh.code).toLowerCase()))){ toast('คำสั่งซ้ำกับรหัสร้าน — ใช้คำอื่น', 'error'); return; }
    DB.meta.line_cmds = c;
  }
  const lc = lineCmds();
  logHistory('line_cmds', '@' + lc.tag + ' · /' + lc.vdo + '/ /' + lc.rvdo + '/ /' + lc.dvdo + '/');
  saveDB(); toast('บันทึกคำสั่ง LINE แล้ว'); renderSettings();
});
