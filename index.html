document.addEventListener('click', e=>{
  const t = e.target.closest('[data-nav],[data-goto-check],[data-mark-done],[data-mark-progress],[data-undo],[data-bs-pid],[data-tt-add],[data-tt-edit],[data-copy-user],[data-export-user],[data-toggle-user],[data-del-user],[data-del-shop],[data-lst-page],[data-chk-status],[data-reset-pw],[data-deactivate-product],[data-edit-product],[data-assign-shops],[data-save-user-shop],[data-tiktok-new],[data-tiktok-delete],[data-open-news],[data-news-prev],[data-news-next],[data-news-dot],[data-fix-filter],[data-addsku-tab],[data-fix-save],[data-fix-skip],[data-fix-del],[data-fix-reopen],[data-fix-export],[data-fix-clear-done]');
  if(!t) return;
  const pid = t.dataset.markDone || t.dataset.markProgress || t.dataset.undo || t.dataset.bsPid || t.dataset.ttAdd || t.dataset.ttEdit;
  if(t.dataset.nav){
    if(t.dataset.nav === 'check' && t.dataset.platform){
      checkState.platform = t.dataset.platform;
      const visibleShopIds = getAssignedShopIds(currentUser);
      const shops = DB.shops.filter(s => s.platform === checkState.platform && (isAdmin() || visibleShopIds.includes(s.id)));
      checkState.shopId = shops.length ? shops[0].id : null;
      checkState.selected.clear();
    }
    navTo(t.dataset.nav); return;
  }
  if(t.hasAttribute('data-news-prev')){
    const track = document.getElementById('officialNewsTrack');
    if(!track) return;
    const total = track.children.length || 1;
    const next = (Number(track.dataset.index || 0) - 1 + total) % total;
    track.dataset.index = String(next);
    updateNewsCarousel(next);
    return;
  }
  if(t.hasAttribute('data-news-next')){
    const track = document.getElementById('officialNewsTrack');
    if(!track) return;
    const total = track.children.length || 1;
    const next = (Number(track.dataset.index || 0) + 1) % total;
    track.dataset.index = String(next);
    updateNewsCarousel(next);
    return;
  }
  if(t.hasAttribute('data-news-dot')){
    updateNewsCarousel(Number(t.dataset.newsDot));
    const track = document.getElementById('officialNewsTrack');
    if(track) track.dataset.index = String(Number(t.dataset.newsDot));
    return;
  }
  if(t.hasAttribute('data-open-news')){
    const parts = (t.dataset.openNews || '').split('|');
    if (parts.length >= 7) {
      openOfficialNewsDetail({
        title: parts[0],
        brand: parts[1],
        source: parts[2],
        url: parts[3],
        detail: parts[4],
        summary: parts[5],
        image: parts[6]
      });
    }
    return;
  }
  if(t.dataset.addskuTab){ addSkuTab = t.dataset.addskuTab; renderAddSku(); return; }
  if(t.dataset.fixFilter){ importFixFilter = t.dataset.fixFilter; renderImportFix(); return; }
  if(t.dataset.fixSave){ saveImportFix(t.dataset.fixSave); return; }
  if(t.dataset.fixSkip || t.dataset.fixReopen){
    const a = (DB.import_audits||[]).find(x => x.id === (t.dataset.fixSkip || t.dataset.fixReopen)); if(!a) return;
    if(t.dataset.fixSkip){ a.status='ignored'; a.resolved_at=nowISO(); } else { a.status='open'; a.resolved_at=null; a.note=''; }
    saveDB(); renderNav(); renderImportFix(); return;
  }
  if(t.dataset.fixDel){ DB.import_audits = (DB.import_audits||[]).filter(x => x.id !== t.dataset.fixDel); saveDB(); renderImportFix(); return; }
  if(t.hasAttribute('data-fix-clear-done')){
    if(!confirm('ลบรายการที่แก้แล้ว/ข้ามทั้งหมด?')) return;
    DB.import_audits = (DB.import_audits||[]).filter(a => !a.status || a.status==='open'); saveDB(); toast('ล้างรายการแล้ว'); renderImportFix(); return;
  }
  if(t.hasAttribute('data-fix-export')){
    const rows = (DB.import_audits||[]).filter(a => importFixFilter==='open' ? (!a.status||a.status==='open') : (a.status&&a.status!=='open'));
    const csv = ['file,row,sku,base_sku,reason,status,resolved_sku,imported_at'].concat(rows.map(a => [a.file_name||'',a.row??'',a.sku||'',a.base_sku||'',a.reason||'',a.status||'open',a.resolved_sku||'',a.imported_at||''].map(v => '"'+String(v).replace(/"/g,'""')+'"').join(','))).join('\n');
    downloadTextFile('\ufeff'+csv, 'import-failed-'+todayISO()+'.csv'); toast('Export แล้ว'); return;
  }
  if(t.hasAttribute('data-tiktok-new')){ openTikTokJobDialog(); return; }
  if(t.hasAttribute('data-tiktok-delete')){
    const jobId = t.dataset.tiktokDelete;
    const job = (DB.tiktok_jobs || []).find(item => item.id === jobId);
    if(!job) return;
    if(!confirm('ลบงาน TikTok ของร้าน '+job.shop+' นี้ใช่ไหม?')) return;
    DB.tiktok_jobs = (DB.tiktok_jobs||[]).filter(item => item.id !== jobId);
    saveDB();
    toast('ลบงาน TikTok แล้ว');
    renderTikTokJobs();
    return;
  }
  if(t.dataset.gotoCheck){ checkState.q=productById(t.dataset.gotoCheck)?.sku||''; navTo('check'); return; }
  if(t.dataset.markDone){
    const pid=t.dataset.markDone;
    markWork(pid, checkState.platform, checkState.shopId, 'done');
    toast('บันทึก "ทำแล้ว" เรียบร้อย'); renderCheck(); return;
  }
  if(t.dataset.markProgress){ markWork(t.dataset.markProgress, checkState.platform, checkState.shopId, 'progress'); toast('บันทึก "กำลังทำ"'); renderCheck(); return; }
  if(t.dataset.undo){ markWork(t.dataset.undo, checkState.platform, checkState.shopId, 'pending'); toast('ยกเลิกสถานะแล้ว'); renderCheck(); return; }
  if(t.dataset.bsPid){
    let w = getWorklog(t.dataset.bsPid, checkState.platform, checkState.shopId);
    if(!w){ markWork(t.dataset.bsPid, checkState.platform, checkState.shopId, 'pending'); w = getWorklog(t.dataset.bsPid, checkState.platform, checkState.shopId); }
    if(!w) return; toggleBigseller(w); toast(w.bigseller_done?'ลง BigSeller แล้ว ✓':'ยกเลิก BigSeller'); renderCheck(); return;
  }
  if(t.dataset.ttAdd || t.dataset.ttEdit){
    let w = getWorklog(pid, checkState.platform, checkState.shopId);
    if(!w){ markWork(pid, checkState.platform, checkState.shopId, 'pending'); w = getWorklog(pid, checkState.platform, checkState.shopId); }
    if(!w) return;
    const cur = tiktokOf(w.id);
    openTiktokUrlDialog(cur ? cur.url : '', function(urlValue){
      saveTiktok(w, urlValue);
      toast('บันทึกลิงก์ TikTok แล้ว');
      renderCheck();
    });
    return;
  }
  if(t.dataset.copyUser){ const txt=buildReportText(reportDate, t.dataset.copyUser); copyText(txt).then(ok=>toast(ok?'คัดลอกรายงานแล้ว ✓':'คัดลอกไม่สำเร็จ กรุณาลองใหม่', ok?'success':'error')); return; }
  if(t.dataset.exportUser){ const uid_ = t.dataset.exportUser; const u = userById(uid_); const txt = buildReportText(reportDate, uid_); const safe = (u && u.name ? u.name : 'user').replace(/\s+/g,'_'); downloadTextFile(txt, `report-${safe}-${reportDate}.txt`); toast('บันทึกรายงานเป็นไฟล์ .txt แล้ว'); return; }
  if(t.dataset.toggleUser){ const u=userById(t.dataset.toggleUser); if(u){u.active=!u.active; saveDB(); toast(u.active?'เปิดใช้งานแล้ว':'ปิดใช้งานแล้ว'); renderUsers();} return; }
  if(t.dataset.delUser){ if(confirm('ลบผู้ใช้นี้? งานที่ทำไว้ยังคงอยู่')){ DB.users=DB.users.filter(u=>u.id!==t.dataset.delUser); saveDB(); toast('ลบแล้ว'); renderUsers();} return; }
  if(t.dataset.assignShops){ showUserShopEditor(t.dataset.assignShops); return; }
  if(t.dataset.saveUserShop){
    const user = userById(t.dataset.saveUserShop); if(!user) return;
    if(user.role === 'Admin'){
      user.shop_ids = DB.shops.filter(s=>s.active).map(s=>s.id);
    } else {
      const boxes = [...document.querySelectorAll('[data-user-shop-id]')];
      user.shop_ids = boxes.filter(cb=>cb.checked).map(cb=>cb.dataset.userShopId);
    }
    saveDB(); toast('ปรับสิทธิ์ร้านสำเร็จ'); $('#modalRoot').innerHTML=''; renderUsers(); return;
  }
  if(t.dataset.resetPw){ const np=prompt('รหัสผ่านใหม่ (อย่างน้อย 4 ตัวอักษร)'); if(np===null) return; if(np.length<4){toast('รหัสสั้นเกินไป','error');return;} const uu=userById(t.dataset.resetPw); if(uu){ if(apiMode) uu.new_password=np; else uu.pass=hash(np); saveDB(); toast('รีเซ็ตรหัสผ่านของ '+uu.name+' เรียบร้อย'); } return; }
  if(t.dataset.editProduct){ openEditProduct(t.dataset.editProduct); return; }
  if(t.dataset.deactivateProduct){ const pp=productById(t.dataset.deactivateProduct); if(pp && confirm('ปิดใช้ SKU '+pp.sku+'? (จะไม่แสดงในการค้นหา)')){ pp.active=false; saveDB(); $('#modalRoot').innerHTML=''; toast('ปิดใช้สินค้าแล้ว'); navTo('skulist'); } return; }

    const label = shop ? ('ร้าน '+shop.platform+' / '+shop.code) : 'ทุกร้าน';
    if(!confirm('รีเซ็ตสถานะงานของ '+label+' ทั้งหมด '+targets.length+' รายการ?\n\nสถานะ ทำแล้ว/กำลังทำ, BigSeller และลิงก์ TikTok จะถูกลบ (SKU ยังอยู่)\nแนะนำให้ Export สำรองข้อมูลก่อน')) return;
    if(sid==='all' && prompt('พิมพ์คำว่า RESET เพื่อยืนยันการรีเซ็ตทุกร้าน')!=='RESET'){ toast('ยกเลิกการรีเซ็ต','info'); return; }
    const ids = new Set(targets.map(w => w.id));
    DB.worklogs = DB.worklogs.filter(w => !ids.has(w.id));
    const ttBefore = DB.tiktoks.length;
    DB.tiktoks = DB.tiktoks.filter(t => !ids.has(t.worklog_id));
    logHistory('reset_status', 'รีเซ็ตสถานะ '+label+' '+ids.size+' งาน (ลิงก์ TikTok '+(ttBefore-DB.tiktoks.length)+')');
    saveDB(); toast('รีเซ็ตสถานะ '+label+' แล้ว ('+ids.size+' งาน)'); renderSettings();
  }
  else if(e.target.id==='resetAll' || e.target.closest('#resetAll')){
    if(!confirm('รีเซ็ตทั้งหมด? ข้อมูลทุกอย่างจะหายไปและกลับเป็นค่าเริ่มต้น')) return;
    if(apiMode){ toast('โหมดออนไลน์: ข้อมูลอยู่ที่ Server ให้ติดต่อ Admin','info'); return; }
    localStorage.removeItem(LS_KEY); loadDB(); toast('รีเซ็ตเรียบร้อย'); navTo('dashboard');
  }
});

/* drag & drop import */
document.addEventListener('dragover', e=>{ if(e.target.closest('#dropZone')){ e.preventDefault(); e.target.closest('#dropZone').style.borderColor='#0d9488'; } });
document.addEventListener('dragleave', e=>{ if(e.target.closest('#dropZone')) e.target.closest('#dropZone').style.borderColor=''; });
document.addEventListener('drop', e=>{ const dz=e.target.closest('#dropZone'); if(dz){ e.preventDefault(); dz.style.borderColor=''; if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]){ handleImportFile(e.dataTransfer.files[0]); e.dataTransfer.clearData(); } } });

/* ---------- init ---------- */
let defaultAdminFlag = false;
function warnDefaultPassword(){
  if(!isAdmin()) return;
  const usingDefault = apiMode ? defaultAdminFlag : (currentUser && currentUser.username==='admin' && currentUser.pass===hash('admin123'));
  if(usingDefault) setTimeout(()=>toast('Admin ยังใช้รหัสผ่านเริ่มต้น (admin123) — กรุณาเปลี่ยนที่หน้า Settings','error'), 1200);
}
async function init(){
  let j = null;
  for(let attempt = 0; attempt < 2 && !j; attempt++){
    try{ j = (await api('me')).j; }
    catch(e){ if(e.browserCheck){ recoverFromBrowserCheck(); return; } if(!attempt) await new Promise(r => setTimeout(r, 1500)); }
  }
  if(!j) setTimeout(() => toast('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — ตอนนี้ใช้ข้อมูลในเครื่องนี้ชั่วคราว (กด F5 เพื่อลองใหม่)','error'), 800);
  if(j && j.api){
    apiMode = true;
    defaultAdminFlag = !!j.default_admin;
    const demoBox = document.getElementById('loginDemo'); if(demoBox && !j.default_admin) demoBox.classList.add('hidden');
    if(j.user){ currentUser = j.user; if(await pullDB() && currentUser) showApp(); else showLogin(); }
    else showLogin();
  } else {
    loadDB(); restoreSession();
    ensureDailyResetState();
    if(currentUser) showApp(); else showLogin();
  }
  if(window.lucide) lucide.createIcons();
  setInterval(() => { if(!document.hidden) refreshRuntimeState(); }, apiMode ? 45000 : 60000);
  startVersionWatch();
  document.addEventListener('visibilitychange', () => { if(!document.hidden) refreshRuntimeState(); });
  window.addEventListener('focus', () => refreshRuntimeState());
  if(!apiMode) window.addEventListener('storage', e => { if(e.key===LS_KEY) refreshRuntimeState(); });
}
appReady = init();
})();
</script>
